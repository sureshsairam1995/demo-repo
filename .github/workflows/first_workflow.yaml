name: Local Git Actions Test

# This workflow triggers every time you push code to the main branch
on:
  push:
    branches: [ main ]

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4   # Clones your repository into the runner

      - name: Run a One-Line Script
        run: echo "Hello! Your local Git setup successfully triggered this action."

